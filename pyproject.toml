
[project]
name = "fairdm-dev-tools"
description = "Tools to assist development of FairDM data portals"
license = "MIT"
dynamic = ["version"]
readme = "README.md"
authors = [{name = "Sam", email = "samuel.scott.jennings@gmail.com"}]
requires-python = '>=3.10,<4'
dependencies = []

[project.optional-dependencies]
test = [
    "coverage (>=7.13.4,<8.0.0)",
    "django-coverage-plugin (>=3.2.0,<4.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "pytest-env (>=1.2.0,<2.0.0)",
    "pytest-sugar (>=1.1.1,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
]
dev = [
    'black (>=26.1.0,<27.0.0)',
    'deptry (>=0.24.0,<0.25.0)',
    'django-debug-toolbar (>=6.2.0,<7.0.0)',
    'django-debug-toolbar-template-profiler (>=2.1.0,<3.0.0)',
    'django-extensions (>=4.1,<5.0)',
    'django-stubs (>=5.2.9,<6.0.0)',
    'djlint (>=1.36.4,<2.0.0)',
    'invoke (>=2.2.1,<3.0.0)',
    'ipython (>=8.12.0,<9.0.0)',
    'mypy (>=1.19.1,<2.0.0)',
    'pre-commit (>=4.5.1,<5.0.0)',
    "pylint-celery (>=0.3,<0.4)",
    "pylint-django (>=2.7.0,<3.0.0)",
    'types-python-dateutil (>=2.9.0.20241206,<3.0.0.0)',
    'types-requests (>=2.32.0.20241016,<3.0.0.0)',
    "djangorestframework-stubs (>=3.16.8,<4.0.0)",
    "django-model-info (>=2024.11.5,<2025.0.0)",
    "django-browser-reload (>=1.21.0,<2.0.0)",
]


[tool.poetry]
version = "2025.1"
include = ["LICENSE", "README.md"]
requires-poetry = '>=2.0,<3.0'

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"
