[tool.poetry]
name = "fairdm-dev-tools"
version = "2025.1"
description = "Tools to assist development of FairDM data portals"
authors = ["Sam <samuel.scott.jennings@gmail.com>"]
license = "MIT"
readme = "README.md"
include = ["LICENSE", "README.md"]
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10,<4"
black = "^24.8.0"
coverage = "^7.6.0"
deptry = "^0.20.0"
django-coverage-plugin = "^3.1.0"
django-debug-toolbar = "^4.4.0"
django-debug-toolbar-template-profiler = "^2.1.0"
django-extensions = "^3.2.0"
django-stubs = "^5.1.0"
djlint = "^1.35.0"
invoke = "^2.2.0"
ipython = "^8.12.0"
mypy = "^1.14.0"
pip-licenses = "^4.5.0"
pre-commit = "^3.5.0"
pylint-celery = "^0.3"
pylint-django = "^2.6.1"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-django = "^4.11.1"
pytest-env = "^1.1.5"
pytest-sugar = "^1.1.1"
tox = "^4.25.0"
types-python-dateutil = "^2.9.0.20241206"
types-requests = "^2.32.0.20241016"
djangorestframework-stubs = "^3.15.0"
factory-boy = "^3.3.3"
django-model-info = "^0.2.2"
django-browser-reload = "^1.15.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
